name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kindling
          POSTGRES_PASSWORD: kindling
          POSTGRES_DB: kindling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kindling -d kindling"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Create the test database
        run: docker exec ${{ job.services.postgres.id }} psql -U kindling -d kindling -c "CREATE DATABASE kindling_test OWNER kindling;"

      - name: Test
        env:
          KINDLING_TEST_DATABASE_URL: postgresql+asyncpg://kindling:kindling@localhost:5432/kindling_test
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag kindling:ci .

      - name: Smoke test
        # Memory store, so no database is needed; /livez must answer once the server is up.
        run: |
          docker run --detach --name kindling -e KINDLING_STORE=memory -p 127.0.0.1:8000:8000 kindling:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/livez; then exit 0; fi
            sleep 1
          done
          docker logs kindling
          exit 1
