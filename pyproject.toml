[project]
name = "kindling"
version = "0.1.0"
description = "A local AI assistant backend: streaming chat over Ollama (Nemotron by default), tool calling, saved conversations in Postgres, an OpenAI-compatible API and an eval harness."
readme = "README.md"
authors = [{ name = "Gopal Saini" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "ollama>=0.6.3",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.scripts]
kindling = "kindling.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "openai>=1.50",
    "anthropic>=0.40",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Security", "kindling.api.deps.require_scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
